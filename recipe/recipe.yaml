# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

schema_version: 1

context:
  version: "1.15.0"

package:
  name: maturin
  version: "${{ version }}"

source:
  url: https://pypi.org/packages/source/m/maturin/maturin-${{ version }}.tar.gz
  sha256: "94b26cc8e8aba61a5f2099715fe640e18c5f678e9a500408b38761263954228a"

build:
  number: 2
  skip: not is_python_min
  python:
    version_independent: true

  script:
    env:
      MATURIN_SETUP_ARGS: "--no-default-features --features=full,native-tls,password-storage"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      OPENSSL_NO_VENDOR: "1"
    content:
      - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
      - ${{ "export OPENSSL_DIR=$PREFIX" if unix }}
      # Newer rustc (1.96, but not yet 1.91) links linux-gnu targets with its bundled
      # rust-lld, which cannot handle the inline-PLT relocations (R_PPC64_PLTSEQ/
      # R_PPC64_PLTCALL) gcc emits on ppc64le for the -fno-plt in conda-forge's
      # CFLAGS; use binutils ld instead.
      - ${{ 'export CARGO_BUILD_RUSTFLAGS="${CARGO_BUILD_RUSTFLAGS:-} -C link-arg=-fuse-ld=bfd"' if linux }}
      - "${{ PYTHON }} -m pip install -v --use-pep517 --no-build-isolation ."

  dynamic_linking:
    missing_dso_allowlist:
      - if: osx
        then:
          - /usr/lib/libresolv.9.dylib

requirements:
  build:
    - cargo-bundle-licenses
    - "${{ compiler('c') }}"
    - "${{ stdlib('c') }}"
    - "${{ compiler('rust') }}"
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
  host:
    - python
    - pip
    - setuptools
    - setuptools-rust >=1.4.0
    - wheel
    - tomli >=1.1.0
    - if: unix
      then:
        - openssl
        - pkg-config
  run:
    # do we really need python here?
    - python
    - tomli >=1.1.0

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - maturin
  - script:
      - maturin --help

about:
  homepage: https://github.com/PyO3/maturin
  repository: https://github.com/PyO3/maturin
  license: MIT
  license_family: MIT
  license_file:
    - license-mit
    - THIRDPARTY.yml
  summary: >-
    Build and publish crates with pyo3, rust-cpython and cffi bindings as well as rust binaries as python packages

extra:
  recipe-maintainers:
    - messense
    - apcamargo
    - synapticarbors
